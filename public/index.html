<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Wheel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>
  <main class="container">
    <section class="card">
      <h1>🎉 VÒNG QUAY MAY MẮN</h1>
      <p class="sub">Nhập tên của bạn để tham gia</p>

      <input id="name" maxlength="60" autocomplete="name" placeholder="Nhập họ và tên..." />
      <button id="spinBtn">QUAY NGAY</button>

      <div class="wheel-wrap">
        <div class="pointer">▼</div>
        <canvas id="wheel" width="420" height="420"></canvas>
      </div>

      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
    </section>

    <footer class="footer">
      Bản quyền thuộc về Lê Văn Vững IPQC
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
